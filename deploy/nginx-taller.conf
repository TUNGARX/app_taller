# Live config, kept in sync with the server after certbot's automatic edits.
# On a fresh server, install the plain HTTP version first (no listen 443/ssl_*
# lines), then run `certbot --nginx -d <domain>` — it rewrites this file
# in place to add the block below plus the HTTP->HTTPS redirect server block.
server {
    server_name taller.automotivo.fonsfideishop.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/taller.automotivo.fonsfideishop.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/taller.automotivo.fonsfideishop.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = taller.automotivo.fonsfideishop.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name taller.automotivo.fonsfideishop.com;
    return 404; # managed by Certbot
}
